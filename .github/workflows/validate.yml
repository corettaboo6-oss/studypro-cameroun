name: Validate STUDYPRO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          node --check courses.js
          node --check lessons-year1.js
          node --check lessons-year2.js
          node --check lessons-year3.js
          node --check dashboard-v2.js
      - name: Run smoke tests
        run: python scripts/smoke-test.py
